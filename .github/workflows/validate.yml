name: Validate Orbis UI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/copy-web.js
      - name: Check required project files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s package.json
          test -s capacitor.config.json
          test -s scripts/copy-web.js
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          grep -q 'manifest.webmanifest' index.html
