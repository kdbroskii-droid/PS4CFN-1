<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Orbis UI</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080b12;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 10%,#244b7a 0,transparent 38%),linear-gradient(135deg,#080b12,#101d32);}.top{height:70px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.logo{font-weight:900;letter-spacing:.2em}.status{color:#bdc9d9;font-size:13px}main{padding:5vh 5vw 100px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#91b9e9;font-weight:800}h1{font-size:clamp(32px,5vw,52px);margin:8px 0}.muted,small{color:#aab7c9}.games{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:28px}.game{border:1px solid transparent;background:transparent;color:white;text-align:left;padding:8px;border-radius:14px;cursor:pointer}.game.selected,.game:focus{border-color:#8fc2ff;background:#ffffff12;outline:0;transform:translateY(-3px)}.art{height:clamp(130px,18vw,220px);border-radius:10px;padding:14px;display:flex;align-items:end;font-weight:900;letter-spacing:.05em;box-shadow:inset 0 -70px 60px #0006}.a1{background:linear-gradient(145deg,#b5f4ff,#258cc7 50%,#172c70)}.a2{background:linear-gradient(145deg,#d1d7df,#394453,#101820)}.a3{background:linear-gradient(145deg,#ffc56c,#d65345,#493d98)}.a4{background:linear-gradient(145deg,#8cc96c,#35754b,#49362a)}.a5{background:linear-gradient(145deg,#8276c0,#263d70)}.a6{background:linear-gradient(145deg,#2b4569,#111d32);font-size:45px;align-items:center;justify-content:center}.name{display:block;margin:10px 0 4px;font-weight:700}.lower{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}.quick{background:#ffffff0c;border:1px solid #ffffff20;color:white;border-radius:12px;padding:18px 22px;cursor:pointer;min-width:160px;text-align:left}.quick b,.quick small{display:block;margin-top:7px}.quick:focus{outline:2px solid #8fc2ff}.overlay{position:fixed;inset:0;background:#030711d9;backdrop-filter:blur(16px);display:flex;align-items:end;padding:6vh 7vw}.panel{width:100%;background:#172338f2;border:1px solid #ffffff24;border-radius:20px;padding:26px;max-height:85vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.tile{background:#ffffff12;border:1px solid #ffffff20;border-radius:12px;padding:18px;min-height:110px;color:white;text-align:left;cursor:pointer}.tile.on{background:#2768a9}.row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #ffffff20}.close{float:right;background:#ffffff18;border:0;color:white;border-radius:50%;font-size:22px;width:36px;height:36px}.hidden{display:none}.hints{position:fixed;bottom:0;background:#05080edb;width:100%;padding:14px 5vw;color:#bdc9d9;font-size:12px;display:flex;gap:24px}.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#eaf3ff;color:#14243a;padding:12px 18px;border-radius:9px}.profile{border-radius:50%;background:#34577f;color:white;border:0;padding:10px 14px}@media(max-width:850px){.games{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.games{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}main{padding:30px 16px 90px}.top{padding:0 16px}.overlay{padding:20px 12px}.hints{gap:12px;overflow:auto;white-space:nowrap}}
</style></head><body>
<header class="top"><div class="logo">◈ ORBIS</div><div class="status"><span id="clock"></span>　● Online UI preview　<button class="profile" id="profile">K</button></div></header>
<main><p class="eyebrow">WELCOME BACK</p><h1 id="greeting">Good evening</h1><p class="muted">What are we playing today?</p>
<section class="games" id="games">
<button class="game selected" data-game="Astro's Playroom"><span class="art a1">ASTRO'S PLAYROOM</span><span class="name">Astro's Playroom</span><small>Continue playing</small></button>
<button class="game" data-game="Gran Turismo 7"><span class="art a2">GRAN TURISMO 7</span><span class="name">Gran Turismo 7</span><small>Recently played</small></button>
<button class="game" data-game="Fortnite"><span class="art a3">FORTNITE</span><span class="name">Fortnite</span><small>Recently played</small></button>
<button class="game" data-game="Minecraft"><span class="art a4">MINECRAFT</span><span class="name">Minecraft</span><small>Game library</small></button>
<button class="game" data-game="Media Gallery"><span class="art a5">MEDIA GALLERY</span><span class="name">Media Gallery</span><small>Captures</small></button>
<button class="game" data-action="library"><span class="art a6">▦</span><span class="name">Game Library</span><small>View collection</small></button></section>
<section class="lower"><button class="quick" data-action="store">▣<b>PlayStation Store</b><small>Store preview</small></button><button class="quick" data-action="settings">⚙<b>Settings</b><small>Personalise dashboard</small></button><button class="quick" data-action="notifications">♧<b>Notifications</b><small>Activity</small></button><button class="quick" data-action="control">⌘<b>Control Centre</b><small>Quick settings</small></button></section>
</main>
<div class="overlay hidden" id="overlay"><div class="panel"><button class="close" id="close">×</button><p class="eyebrow" id="eyebrow">CONTROL CENTRE</p><h2 id="title">Quick settings</h2><div id="content" class="grid"></div><p class="muted" id="foot">× Select　　◯ Back</p></div></div><div class="hints">× Select　　◯ Back　　OPTIONS Menu　　M / Touchpad: Control Centre</div><script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let idx=0,overlay=false,profile=localStorage.getItem('orbis-name')||'KD',toggles={Network:true,Sound:true,Microphone:true};const cards=$$('.game');function clock(){$('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);$('#greeting').textContent='Good evening, '+profile;$('#profile').textContent=profile[0].toUpperCase();function choose(n){idx=(n+cards.length)%cards.length;cards.forEach((c,i)=>c.classList.toggle('selected',i===idx));cards[idx].scrollIntoView({block:'nearest',inline:'nearest'})}function show(title,eyebrow,html){overlay=true;$('#title').textContent=title;$('#eyebrow').textContent=eyebrow;$('#content').innerHTML=html;$('#overlay').classList.remove('hidden')}function close(){overlay=false;$('#overlay').classList.add('hidden')}function control(){show('Control Centre','QUICK SETTINGS',Object.keys(toggles).map(k=>'<button class="tile '+(toggles[k]?'on':'')+'" data-toggle="'+k+'">'+k+'<br><small>'+(toggles[k]?'On':'Off')+'</small></button>').join('')+'<button class="tile" data-action="accessories">⌘<br>Accessories</button><button class="tile" data-action="settings">⚙<br>Settings</button><button class="tile" data-action="profile">☺<br>Profile</button>')}function settings(){show('Settings','PERSONALISE','<div class="row">Accent colour <select id="accent"><option>Blue</option><option>Violet</option><option>Cyan</option></select></div><div class="row">Reduced motion <input type="checkbox" id="motion"></div><div class="row">Controller mappings <button data-action="controls">View</button></div><div class="row">Local profile <button data-action="profile">Edit</button></div>');$('#accent').value=localStorage.getItem('orbis-accent')||'Blue';$('#accent').onchange=e=>{localStorage.setItem('orbis-accent',e.target.value);document.documentElement.style.setProperty('--blue',e.target.value==='Violet'?'#a78bfa':e.target.value==='Cyan'?'#67e8f9':'#4b9cff')};$('#motion').checked=localStorage.getItem('orbis-motion')==='true';$('#motion').onchange=e=>localStorage.setItem('orbis-motion',e.target.checked)}function profilePanel(){show('Profile','LOCAL PROFILE','<div class="row">Name <input id="name" maxlength="18" value="'+profile+'"></div><p class="muted">Stored locally in this browser. This is not a PSN account.</p><button id="save">Save profile</button>');$('#save').onclick=()=>{profile=$('#name').value.trim()||'Player';localStorage.setItem('orbis-name',profile);$('#profile').textContent=profile[0].toUpperCase();$('#greeting').textContent='Good evening, '+profile;close()}}function controls(){show('Controller mapping','INPUT GUIDE','<div class="row">D-pad / left stick <b>Navigate</b></div><div class="row">Cross / Enter <b>Select</b></div><div class="row">Circle / Escape <b>Back</b></div><div class="row">Options / M <b>Control Centre</b></div><div class="row">PS button <b>Reserved by PS4</b></div><p class="muted">The PS button is not reliably exposed by the browser Gamepad API. A web page cannot globally remap tap/hold PS.</p>')}function action(a){if(a==='control')control();if(a==='settings')settings();if(a==='profile')profilePanel();if(a==='controls')controls();if(a==='library')show('Game Library','YOUR GAMES','<p class="muted">Browser pages cannot automatically enumerate installed PS4 games.</p>');if(a==='store')show('PlayStation Store','PREVIEW','<p class="muted">Use the official console Store for real purchases and PSN account functions.</p>');if(a==='notifications')show('Notifications','ACTIVITY','<p class="muted">You are all caught up.</p>');if(a==='accessories')show('Accessories','CONTROLLER','<p class="muted">Controller detection: '+(navigator.getGamepads&&[...navigator.getGamepads()].some(Boolean)?'Connected':'Not detected')+'. PS button remains system-reserved.</p>')}document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){action(b.dataset.action);return}let t=e.target.closest('[data-toggle]');if(t){let k=t.dataset.toggle;toggles[k]=!toggles[k];t.classList.toggle('on',toggles[k]);t.innerHTML=k+'<br><small>'+(toggles[k]?'On':'Off')+'</small>';return}let g=e.target.closest('[data-game]');if(g){if(g.dataset.action==='library')action('library');else{show(g.dataset.game,'GAME SELECTED','<p class="muted">This dashboard can select a title, but launching installed PS4 games requires system-level integration unavailable to a browser page.</p>')}}});$('#close').onclick=close;$('#profile').onclick=profilePanel;document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){if(overlay)close();return}if(e.key.toLowerCase()==='m'||e.key==='o'){control();return}if(overlay)return;if(e.key==='ArrowRight'||e.key==='ArrowDown')choose(idx+1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')choose(idx-1);if(e.key==='Enter'||e.key===' '){cards[idx].click()}});let last=[],axisX=false,axisY=false;function poll(){let gps=navigator.getGamepads?navigator.getGamepads():[];let gp=[...gps].find(Boolean);if(gp){let b=gp.buttons.map(x=>x.pressed),hit=i=>b[i]&&!last[i];if(hit(0)){if(overlay)close();else cards[idx].click()}if(hit(1)&&overlay)close();if(hit(3)||hit(9)){if(overlay)close();else control()}let x=gp.axes[0]||0,y=gp.axes[1]||0;if(Math.abs(x)>.65&&!axisX){choose(idx+(x>0?1:-1));axisX=true}if(Math.abs(y)>.65&&!axisY){choose(idx+(y>0?1:-1));axisY=true}if(Math.abs(x)<.25)axisX=false;if(Math.abs(y)<.25)axisY=false;last=b}requestAnimationFrame(poll)}poll();choose(0)})();
</script></body></html>
